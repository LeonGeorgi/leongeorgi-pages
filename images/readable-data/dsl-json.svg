<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Podcast sequence source and generated JSON</title>
  <desc id="desc">The valid DSL file podcast-intro.dsl is shown beside an excerpt from engine.json. The selected play welcome until finished instruction maps to the highlighted cue-3 and cue-4 nodes, with dimmed neighboring nodes providing context.</desc>

  <rect width="960" height="640" fill="#fff"/>
  <rect width="960" height="82" fill="#fafbfa"/>
  <path d="M0 82H960M520 0V640" stroke="#dfe3df"/>

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="20.5" font-weight="600" fill="#34414c">
    <text x="20" y="49">podcast-intro.dsl</text>
    <text x="540" y="49">podcast-intro.json</text>
  </g>
  <rect x="10" y="275" width="500" height="34" rx="5" fill="#dfeefa"/>
  <rect x="10" y="275" width="4" height="34" rx="2" fill="#376e9f"/>

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="18" fill="#293640" xml:space="preserve">
    <text x="20" y="120"><tspan fill="#245584" font-weight="700">sequence</tspan><tspan> "Podcast intro" {</tspan></text>
    <text x="36" y="148"><tspan fill="#245584" font-weight="700">audio</tspan><tspan> "intro-music" </tspan><tspan fill="#245584" font-weight="700">from</tspan><tspan> "intro-music.ogg"</tspan></text>
    <text x="36" y="176"><tspan fill="#245584" font-weight="700">audio</tspan><tspan> "welcome" </tspan><tspan fill="#245584" font-weight="700">from</tspan><tspan> "welcome.ogg"</tspan></text>
    <text x="36" y="204"><tspan fill="#245584" font-weight="700">audio</tspan><tspan> "episode" </tspan><tspan fill="#245584" font-weight="700">from</tspan><tspan> "episode.ogg"</tspan></text>
    <text x="36" y="244"><tspan fill="#245584" font-weight="700">play</tspan><tspan> "intro-music" </tspan><tspan fill="#245584" font-weight="700">loop</tspan></text>
    <text x="36" y="272"><tspan fill="#245584" font-weight="700">fade</tspan><tspan> "intro-music" </tspan><tspan fill="#245584" font-weight="700">to</tspan><tspan> 20% </tspan><tspan fill="#245584" font-weight="700">over</tspan><tspan> 2s</tspan></text>
    <text x="36" y="300"><tspan fill="#245584" font-weight="700">play</tspan><tspan> "welcome" </tspan><tspan fill="#245584" font-weight="700">until finished</tspan></text>
    <text x="36" y="328"><tspan fill="#245584" font-weight="700">fade</tspan><tspan> "intro-music" </tspan><tspan fill="#245584" font-weight="700">to</tspan><tspan> 0% </tspan><tspan fill="#245584" font-weight="700">over</tspan><tspan> 1s</tspan></text>
    <text x="36" y="356"><tspan fill="#245584" font-weight="700">stop</tspan><tspan> "intro-music"</tspan></text>
    <text x="36" y="384"><tspan fill="#245584" font-weight="700">play</tspan><tspan> "episode" </tspan><tspan fill="#245584" font-weight="700">until finished</tspan></text>
    <text x="20" y="412">}</text>
  </g>

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="15.5" fill="#697681" xml:space="preserve">
    <text x="548" y="106">"nodes": [</text>
    <text x="564" y="126">{ "id": "cue-2", … },</text>
  </g>

  <rect x="536" y="140" width="414" height="190" rx="6" fill="#e7f0f8"/>
  <rect x="536" y="344" width="414" height="176" rx="6" fill="#e7f0f8"/>
  <rect x="536" y="140" width="4" height="190" rx="2" fill="#668db2"/>
  <rect x="536" y="344" width="4" height="176" rx="2" fill="#668db2"/>

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="17" fill="#26343e" xml:space="preserve">
    <text x="554" y="160">{</text>
    <text x="570" y="178">"id": <tspan fill="#87412d">"cue-3"</tspan>,</text>
    <text x="570" y="196">"type": <tspan fill="#87412d">"audio.start"</tspan>,</text>
    <text x="570" y="214">"parameters": {</text>
    <text x="586" y="232">"assetRef": <tspan fill="#87412d">"welcome"</tspan>,</text>
    <text x="586" y="250">"playbackId": <tspan fill="#87412d">"voice-welcome"</tspan>,</text>
    <text x="586" y="268">"loop": <tspan fill="#63428b">false</tspan></text>
    <text x="570" y="286">},</text>
    <text x="570" y="304">"next": <tspan fill="#87412d">"cue-4"</tspan></text>
    <text x="554" y="322">},</text>

    <text x="554" y="364">{</text>
    <text x="570" y="382">"id": <tspan fill="#87412d">"cue-4"</tspan>,</text>
    <text x="570" y="400">"type": <tspan fill="#87412d">"event.wait"</tspan>,</text>
    <text x="570" y="418">"parameters": {</text>
    <text x="586" y="436">"source": <tspan fill="#87412d">"voice-welcome"</tspan>,</text>
    <text x="586" y="454">"event": <tspan fill="#87412d">"playback.ended"</tspan></text>
    <text x="570" y="472">},</text>
    <text x="570" y="490">"next": <tspan fill="#87412d">"cue-5"</tspan></text>
    <text x="554" y="508">},</text>
  </g>

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="15.5" fill="#697681" xml:space="preserve">
    <text x="564" y="548">{ "id": "cue-5", … },</text>
    <text x="564" y="570">…</text>
    <text x="548" y="592">]</text>
  </g>

</svg>
